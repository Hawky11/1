[COM]
; 1 = force both players to CPU, 0 = restore the CE [DISABLE] state (P1 human, P2 CPU)
ForceCpuForBoth=1

; Same polling interval as the confirmed CE script. Range: 1..1000 ms.
WriteIntervalMs=10

[AIResearch]
EnableStage38CallbackWindowTrace=1
; Stage 2 legacy observer on the two COM control DWORDs. It shares DR0/DR1 with Stage16.
; Keep disabled while EnablePlayerBit17WriteTrace=1.
EnableControlFieldTrace=0

; Thread discovery interval. Stage16 defaults to 100 ms to reduce time before new threads are watched.
ThreadScanIntervalMs=100

; 1 = trace the command-resolution helper at AALib.exe+0xF4030 (diagnostics only).
; Uses DR2/DR3 execution breakpoints. Stage16 preserves DR2/DR3 and may run alongside it.
EnableCommandResolveTrace=0
CommandTraceScanIntervalMs=250

; Stage 21: observe the type-1 / payload 0x1E consumer inside dispatcher 0xEE200.
; Wraps calls at 0xEE426 (helper 0x4E8CF0) and 0xEE446 (helper 0x4F7EB0);
; records the actual AL and exact control-array slot-3 before/after values.
; Diagnostic only. Uses two validated five-byte CALL-site wrappers.
EnableStage21PayloadConsumerTrace=1

; Stage 22: capture controller bit 0x400 before and after the original AND.
; Validates and replaces the 7-byte instruction at AALib.exe+0xEE451 with a CALL + 2 NOPs.
; The wrapper executes the identical AND once and restores its post-AND EFLAGS.
EnableStage22PayloadPostAndTrace=1

; Stage 23: observe the type-1 mapping resolver result before dispatcher EDI is reused.
; Wraps CALL RVA 0xEE273 -> helper RVA 0x12EAC0, records the 12-byte result entry.
; Only P1/P2 type=1 payload=0x1E is logged; original four cdecl args are replayed exactly once.
EnableStage23ResolverResultTrace=1

; Stage24: observe the downstream consumer at CALL RVA 0xEE306 -> helper RVA 0xF57D0.
; Captures runtime table[selector*3..+2] and player+0x3A08 DWORDs before/after the original helper.
; Read-only diagnostics; Stage23 remains enabled for same-event QPC correlation.
EnableStage24ResolverConsumerTrace=1

; Stage 16: write-only 4-byte hardware watchpoints on the exact P1/P2 [player+0x3B84] DWORDs.
; Captures every observed write from AALib.exe, including partial writes and RMW instructions.
; Requires DR0/DR1 to be free in each game thread. Existing DR0/DR1 owners are never overwritten.
; This mode cannot run together with EnableControlFieldTrace because both use DR0/DR1.
; Stage 17: trace the direct callsite that passes bit index 0x71 (113)
; to the generic player bitset setter at AALib.exe+0x0FAA0.
; Logs caller registers/stack and player fields before tail-calling the original setter.
EnableStage17Bit113SetterCallTrace=1
; Stage 18: observe the state-table gate result after helper 0x4F2FD0.
EnableStage18Bit113GateTrace=1
; Stage 19: observe state-code conversion through helper 0x4F02C0.
EnableStage19StateMapTrace=1
; Stage 20: wrap the 0x495B00 bit-2 object guard before the original TEST/JNE.
EnableStage20Bit113ObjectGuardTrace=1

EnablePlayerBit17WriteTrace=0

; Stage29: retain only bit17 transitions in the exact same-session producer experiment.
; Updates the bit17 shadow on every observed write but stores only changed bit17 records.
; Must be used with EnablePlayerBit17WriteTrace=1 and Stage26 bit0 mode disabled.
EnableStage29Bit17TransitionsOnly=1

; Stage26's +0xF8 watcher uses DR0/DR1; disable it when Stage29 bit17 mode is enabled.
; 1=only record bit0 changes, 0=record every observed write (larger logs).
EnableStage26ObjectBit0WriteTrace=0
Stage26TransitionsOnly=1

; 1 = observe writes to the two exact CPU fighter event mailboxes at AALib.exe+0xF2DE0.
EnableCpuQueueTrace=1
; Stage 11: one detailed record per type-1 CPU queue insertion, including caller stack.
EnableCpuQueueDetailTrace=1
QueueTraceFlushIntervalMs=1000

; 1 = trace the per-player event dispatcher at AALib.exe+0xEE200.
EnableCpuEventDispatchTrace=1
; Stage 12: one timestamped detail record for every type-1 dispatch invocation.
EnableCpuEventDispatchDetailTrace=1

; Stage 11: capture the exact final-command callsite at AALib.exe+0xF7C5D.
EnableFinalCommandTrace=1
FinalCommandTraceFlushIntervalMs=250

; Stage 13: inspect the alternate queue writer at return RVA 0xF6ADC.
EnableAlternateCallsiteTrace=1
AlternateCallsiteTraceFlushIntervalMs=250

; Stage 14: trace the parent producer and its two helper calls.
EnableStage14ProducerCallTrace=1
Stage14ProducerCallTraceFlushIntervalMs=250

; Stage 15: observe the original conditional flow after F2ED0.
EnableStage15BranchTrace=1

; Stage 10 producer context diagnostics.
EnableAIProducerContextTrace=1
ProducerContextTraceFlushIntervalMs=250
ProducerContextFailedResultSampleInterval=16

; Stage 10 parent-flow diagnostics.
EnableAIParentFlowTrace=1
ParentFlowTraceFlushIntervalMs=250
ParentFlowFailedResultSampleInterval=16

; Stage25: observe the original secondary-object OR without adding game-state writes.
EnableStage25SecondaryObjectFlagTrace=1


; Stage31: scoped alternate processing and per-event nested type0 queue records.
EnableStage31AlternatePathTrace=1

; Stage32: add per-event QPC/queue snapshots for dispatched type0/payload0 via existing EE200 hook.
; No new hook. Records go to ArcanaAI_EventDispatchTrace.log as EVENT_DISPATCH_DETAIL.
; Keep EnableCpuEventDispatchTrace=1. Existing type1 details remain unchanged.
EnableStage32Type0DispatchDetail=1

; Stage33: read-only state snapshots around existing EE200 dispatcher for type0/payload0.
; Uses Stage32 detail buffer/worker. Emits STAGE33_EFFECT_DETAIL in ArcanaAI_EventDispatchTrace.log.
; Keep Stage29 AITrace.cpp and Stage32/31 tracing; no new hook.
EnableStage33Type0StateTrace=1

; Stage34: per-event type0 payload1/4/5 via the existing EE200 hook, plus Stage33 payload0.
; For payload1/4/5 write STAGE34_EFFECT_DETAIL with 12 DWORD fields and P+3A6C slot.
; No new hook and no game-state writes. Requires Stage32 + Stage33 + dispatch enabled.
EnableStage34Type0VariantsTrace=1

; Stage35: read-only per-side downstream controller consumption after EE200 state updates.
; Wraps native ACA90 CALL ACABE->F60C0 (TIMER) and ACAC4->F5BD0 (FLAGS).
; Records raw pre/post values, masks, P1/P2 and QPC; never synthesizes commands.
; Requires Stage35_Overlay/src/Stage35ConsumerTrace.inl alongside AIQueueTrace.cpp.
EnableStage35ControllerConsumerTrace=1

; Stage36: observe two native F58E0 bitmap predicate reads and F4360 candidate filter.
; Preserve existing FinalCommandTrace (F7C5D) and EventDispatchTrace (EE200).
; Keep Stage35 observer enabled; no gameplay/state changes, no synthetic events.
EnableStage36ControlToCommandTrace=0

; Stage37: raw EE200 type1 -> F57D0 controller bitmap + EC4F0 object state
; no additional hook, 30 masked DWORD fields before/after, worker log only.
; Requires existing CPU event-dispatch hook and per-event detail enabled.
EnableStage37Type1CommitTrace=1

EnableStage59XWriterWatch=1

EnableStage107ConsumerTrace=1

EnableStage110Cebe0GuardTrace=1

EnableStage113ParentGateTrace=1