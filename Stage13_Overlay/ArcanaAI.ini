[COM]
; 1 = force both players to CPU, 0 = restore the CE [DISABLE] state (P1 human, P2 CPU)
ForceCpuForBoth=1

; Same polling interval as the confirmed CE script. Range: 1..1000 ms.
WriteIntervalMs=10

[AIResearch]
; 1 = automatically watch reads/writes to the two COM control DWORDs (diagnostics only).
; 0 = disabled; no debug registers are used.
EnableControlFieldTrace=0

; Interval for discovering new game threads and installing watchpoints. Range: 50..2000 ms.
ThreadScanIntervalMs=250

; 1 = trace the command-resolution helper at AALib.exe+0xF4030 (diagnostics only).
; Logs candidate/context arguments, the matched mapping-table index and output parameters.
; Uses DR2/DR3 execution breakpoints; requires both debug-register slots to be free.
EnableCommandResolveTrace=0
CommandTraceScanIntervalMs=250

; 1 = observe writes to the two exact CPU fighter event mailboxes at AALib.exe+0xF2DE0.
; This records event type/payload and the code RVA that produced the event.
EnableCpuQueueTrace=1
; Stage 11: one detailed record per type-1 CPU queue insertion, including caller stack.
EnableCpuQueueDetailTrace=1
QueueTraceFlushIntervalMs=1000

; 1 = trace the per-player event dispatcher at AALib.exe+0xEE200.
; Records type/payload after they are handed to the actual event dispatcher.
; This is a diagnostic observer, not an AI behavior patch.
EnableCpuEventDispatchTrace=1
; Stage 12: one timestamped detail record for every type-1 dispatch invocation.
; Set to 0 to retain only the aggregated EVENT_DISPATCH summaries.
EnableCpuEventDispatchDetailTrace=1

; Stage 11: capture the exact final-command callsite at AALib.exe+0xF7C5D.
; P1/P2 are derived from the actual queue pointer; original EDI is logged separately.
; Records ESI, queue arguments, player fields, and parent locals before queue insertion.
EnableFinalCommandTrace=1
FinalCommandTraceFlushIntervalMs=250

; Stage 13: inspect the alternate queue writer at return RVA 0xF6ADC.
; The CALL at 0xF6AD7 is installed only if it resolves to the known F2DE0 helper.
EnableAlternateCallsiteTrace=1
AlternateCallsiteTraceFlushIntervalMs=250

; Stage 10: observe all P1/P2 CPU calls to F34D0/F3930, without caller-RVA filtering.
; Successful returns are always saved; 0xFFFFFFFF failures are sampled 1/N.
EnableAIProducerContextTrace=1
ProducerContextTraceFlushIntervalMs=250
ProducerContextFailedResultSampleInterval=16

; Stage 10: trace every P1/P2 CPU call into F3280/F4030/F4360, without caller-RVA filtering.
; All successful results are captured; 0xFFFFFFFF failures are sampled 1/N.
; Captures caller/RVA, sequence, QPC, EAX, output pointers, parent locals and player fields.
EnableAIParentFlowTrace=1
ParentFlowTraceFlushIntervalMs=250
ParentFlowFailedResultSampleInterval=16
; Legacy fallback only if the Stage 10 key above is absent.
; ParentFlowF4030SampleInterval=16
